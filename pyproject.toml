[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-acceptance-gate"
version = "0.4.0"
description = "Offline acceptance gate for AI coding agent deliveries."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Agent Acceptance Gate Maintainers"}
]
keywords = ["ai", "coding-agent", "ci", "acceptance", "gate", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance"
]
dependencies = []

[project.scripts]
agent-acceptance-gate = "agent_acceptance_gate.cli:main"
aag = "agent_acceptance_gate.cli:main"

[project.urls]
Homepage = "https://github.com/yanqr213/agent-acceptance-gate"
Repository = "https://github.com/yanqr213/agent-acceptance-gate"
Issues = "https://github.com/yanqr213/agent-acceptance-gate/issues"
Changelog = "https://github.com/yanqr213/agent-acceptance-gate/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
